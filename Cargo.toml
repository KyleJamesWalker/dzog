[workspace]
resolver = "2"
members = [
    "crates/dzog-core",
    "crates/dzog-wgpu",
    "crates/dzog-bevy",
    "crates/shmup",
    "asteroids",
]

[workspace.package]
version = "0.2.0"
rust-version = "1.99"
edition = "2021"
license = "MIT"
authors = ["J. Dunlap (jadbox)"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
ron = "0.12"
bytemuck = { version = "1.25", features = ["derive"] }
wgpu = "30"
pollster = "1.0"
hound = "3.5"
log = "0.4"
bevy = { version = "0.20", default-features = false, features = [
    "2d",
    "ui",
    "bevy_audio",
    "bevy_gilrs",
] }

[profile.dev]
opt-level = 2
debug = false

[profile.test]
opt-level = 2
debug = false

[profile.web]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
