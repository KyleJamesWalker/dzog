[workspace]
resolver = "2"
members = [
    "crates/dzog-core",
    "crates/dzog-wgpu",
    "crates/dzog-bevy",
    "pong",
    "asteroids",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["J. Dunlap (jadbox)"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
ron = "0.12"
bytemuck = { version = "1.25", features = ["derive"] }
wgpu = "24.0.5"
pollster = "1.0"
hound = "3.5"
log = "0.4"
bevy = { version = "0.15", default-features = false, features = [
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_ui",
    "bevy_text",
    "bevy_sprite",
    "bevy_audio",
    "x11",
    "wayland",
    "multi_threaded",
    "default_font",
] }
