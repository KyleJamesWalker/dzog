name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: check
        shell: bash
        run: |
          # Extract version from [workspace.package] specifically
          get_ver() {
            sed -n '/\[workspace\.package\]/,/\[/p' Cargo.toml | grep '^version =' | head -n 1 | cut -d '"' -f 2
          }
          CURR=$(get_ver)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            PREV=$(git show origin/${{ github.base_ref }}:Cargo.toml | sed -n '/\[workspace\.package\]/,/\[/p' | grep '^version =' | head -n 1 | cut -d '"' -f 2 || echo "none")
          else
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              PREV=$(git show HEAD~1:Cargo.toml | sed -n '/\[workspace\.package\]/,/\[/p' | grep '^version =' | head -n 1 | cut -d '"' -f 2 || echo "none")
            else
              PREV="none"
            fi
          fi
          
          echo "version=$CURR" >> "$GITHUB_OUTPUT"
          if [ "$CURR" != "$PREV" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # lavapipe gives wgpu a software Vulkan adapter, so the GPU tests run instead of skipping.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace

  desktop:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build_desktop.yml
    with:
      version: ${{ needs.check-version.outputs.version }}
  web:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build_web.yml
    with:
      version: ${{ needs.check-version.outputs.version }}
