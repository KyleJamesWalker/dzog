[project]
name = "dzog-flux-forge"
version = "0.2.0"
description = "Standalone CLI tool for conditioning FLUX.3 [klein] (int8/int4 SDNQ or BF16) on Dzog CohesiveBody masks and baking VGA sprite/constitutive atlases."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.5.0",
    "diffusers>=0.33.0",
    "transformers>=4.49.0",
    "accelerate>=1.0.0",
    "sdnq>=0.2.8",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
]

[project.scripts]
flux-forge = "flux_forge:main"
