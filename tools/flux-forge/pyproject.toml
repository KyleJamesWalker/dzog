[project]
name = "dzog-flux-forge"
version = "0.1.0"
description = "Standalone CLI tool for conditioning FLUX.2 [klein] 4B on Dzog CohesiveBody masks and baking VGA sprite/constitutive atlases."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.4.0",
    "diffusers>=0.32.0",
    "transformers>=4.46.0",
    "accelerate>=1.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
]

[project.scripts]
flux-forge = "flux_forge:main"
